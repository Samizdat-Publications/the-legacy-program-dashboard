# The gate, run somewhere that is not one person's container.
#
# THREE KINDS OF JOB, SINCE 25 SEPTEMBER 2026, when the old single-file shell was
# retired and its browser gate went with it.
#
#   gate     no browser. The whole build (tools/build.py), the reproducibility
#            check over the whole tree, then every Python check through
#            `tools/gate.py --no-build --no-app`: verify and its self-test, the
#            independent audit, build_app_data --check and --self-test, the em dash
#            lint and its self-test, and the browser-resolver self-test.
#   app      the app's own gate: its data re-derived from the committed sources,
#            the Worker's validators, the em dash lint, build app/, serve the build,
#            run the app's checks (C1 onwards) against the real pages, then point
#            tools/look.js at the same server and keep the screenshots.
#   poisons  three parallel jobs, a matrix over shard 1/3, 2/3 and 3/3. Each builds
#            and serves the app and runs its third of the poison sweep
#            (`checks/run.mjs --all-poisons --shard k/3`): every poison damages the
#            real page and the check named for it must be seen to fail. Split
#            because the sweep is one browser run per poison and was the longest
#            single step in CI.
#
# deploy.yml keys off this WORKFLOW's conclusion, not off one job, so every job
# here gates the production deploy without deploy.yml knowing it exists.
#
# WHY. Until 28 August 2026 the gate could only ever run in the Claude Code cloud
# container, because four of its steps hardcoded that container's Chromium path.
# So "the gate is green" was a sentence exactly one actor could say, and nothing
# checked a push made by anyone else. tools/browser_env.js fixed the portability;
# this file is what portability was FOR.
#
# COST. This repository is private, so these minutes are billed against the account's
# Actions allowance. If it is not wanted, delete this file -- the gate still runs
# locally (python tools/gate.py) and nothing else depends on it.
#
# WHAT IT DOES NOT DO. It does not deploy. .github/workflows/deploy.yml does that,
# on master, after this workflow finishes green.

name: gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # None of the history is needed to run the gate.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node, for tools/build_l0_layout.mjs (a build step) and the browser-resolver
      # self-test. No browser is installed in this job.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No pip step. Every tool the gate runs is Python standard library plus this
      # repo's own modules. pypdf appears in tools/spot_check.py, which is a network
      # tool deliberately kept OUT of the gate: a check that fails because a host is
      # throttling is a check people learn to ignore. If you add a dependency, add
      # it here and say what needs it.

      - name: Build
        # tools/build.py is the one build order; later stages consume earlier
        # output. It ends with build_app_data.py, so app/public/data/ is rebuilt
        # here too and the step below compares it with everything else.
        run: python3 tools/build.py

      - name: The build must be reproducible from what is committed
        # A rebuild from committed source must reproduce the committed artifacts. If
        # this fails, someone edited research/ and pushed without rebuilding, or
        # edited a build product by hand -- and the board a reader sees is not the
        # board the sources describe. Nothing else catches that. e04b705 did exactly
        # that and left `master` red.
        #
        # Not `git diff --quiet`: every artifact carries a build-DATE stamp, so a
        # rebuild on a different UTC day from the machine that built the commit
        # differs by one line per file with nothing actually wrong. And not
        # `git diff -I<regex>` either, which would be WORSE THAN THE BUG:
        # data/l0-model.json, data/l0-layout-model.json and data/design-extract.json
        # are each a single line, so the one changed line always contains the stamp
        # and every real change to them would be ignored. tools/check_rebuild.py
        # normalises the stamp (and CRLF) on both sides and compares full bytes.
        run: python3 tools/check_rebuild.py

      - name: Keep the rebuilt artifacts when they differ
        # A local session cannot see what Linux built. On 3 September 2026 a
        # Windows-built commit failed the step above by a few bytes in three files
        # and the only way to find them was to guess. Upload the rebuild so the
        # next session can download it and diff.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-artifacts
          retention-days: 7
          path: |
            data/l0-model.json
            data/design-extract.json
            data/l0-layout-model.json
            data/foia-links.json
            app/public/data/*.json

      - name: ...and that check must be able to fail
        run: python3 tools/check_rebuild.py --self-test

      - name: Every Python check
        # One command, the same one a person runs locally, minus the build (done
        # above) and the app (the jobs below). It stops at the first failure and
        # prints a table of every step it ran.
        run: python3 tools/gate.py --no-build --no-app

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The app's data must match what it is derived from
        # First, because it is seconds and because everything after it is checking a
        # board built from these files. The 1,067 committed files under
        # app/public/data/ are generated, and until 3 September 2026 nothing in CI
        # ran the generator -- so they could drift from data/ and research/ with the
        # gate staying green, and after the cutover that drift is what a reader sees.
        #
        # A PLAIN `git diff --quiet`, no -I flags, since 4 September 2026. It carried
        # -I'"sourceCommit"' -I'"generated"' for one day, and that was a patch over a
        # generator defect rather than a fix of it. Both are gone, and so is the
        # defect. index.json no longer publishes "sourceCommit": it named whatever
        # commit .git/HEAD pointed at, which is a property of the checkout and not of
        # the data. And `source` is now a hash of the input bytes with newlines
        # normalised to LF, so it too stops being a function of the checkout -- this
        # repo has no .gitattributes, a Windows clone with core.autocrlf=true gets
        # CRLF in every text input, and the same commit hashed 3c5aa769b9d2 on the
        # machine that committed the data and e5835f8cdaf3 here. That is what turned
        # this step red on every push: seven files by one line each, index.json by
        # two. `generated` was never the problem -- it is the newest `generated`
        # string among the inputs, so it already matched on both machines.
        #
        # Every value written under app/public/data/ is now a function of the inputs'
        # content and of nothing else, which is what lets this compare full bytes.
        # The repo's standing warning against `git diff -I` -- data/l0-model.json and
        # its two one-line siblings, where the one changed line always carries the
        # stamp and every real change would be swallowed -- needs no exception here
        # any more.
        run: |
          python3 tools/build_app_data.py
          git diff --quiet -- app/public/data/ || {
            echo "::error::app/public/data/ is not what tools/build_app_data.py produces from the committed sources."
            git --no-pager diff --stat -- app/public/data/
            exit 1
          }

      - name: ...and that check must be able to fail
        # Shown, not asserted. --self-test runs --check against the real board and
        # then against a copy with one node removed, and fails if the poisoned copy
        # is accepted.
        run: python3 tools/build_app_data.py --self-test

      - name: The analyst Worker's validators
        # `clean`, `cleanTools` and `cleanSystem` are the only things between a
        # request and the account's tokens, and a tool exchange is a shape they had
        # never been fed until 11 September 2026: an assistant turn carrying a signed
        # thinking block and a tool_use, then a user turn of nothing but tool_result.
        # A dropped or rewritten block there is a 400 the reader cannot diagnose. The
        # test pairs every accepted shape with one that must be refused.
        working-directory: worker
        run: |
          npm install --no-save @anthropic-ai/sdk@0.123.0 esbuild@0.28.1
          node test/validate.mjs

      - name: Install Playwright and a browser
        # At the REPO ROOT, deliberately, and pinned to the same version the
        # `poisons` jobs use. app/checks/run.mjs imports 'playwright' bare and
        # app/node_modules carries none, so Node resolves upward to the root
        # install. Keep the jobs on one version: a check that passes on one browser
        # build and fails on another teaches nobody anything.
        run: |
          npm install --no-save playwright@1.56.1 http-server@14
          npx playwright install --with-deps chromium

      - name: No em dash in the app or the Worker
        # Stewart's standing rule, enforced since redesign phase 1 (24 September
        # 2026). Source only: verbatim quotations in the data keep their own
        # characters. The self-test shows the lint rejecting a planted dash.
        run: |
          python3 tools/lint_no_em_dash.py --self-test
          python3 tools/lint_no_em_dash.py

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run build

      - name: Serve the built app
        # The checks drive the BUILD, not the dev server, so what they walk is what
        # Pages would serve. --host 127.0.0.1 is not decoration: plain `vite preview`
        # binds IPv6 only here, and the checks fetch 127.0.0.1.
        working-directory: app
        run: |
          npm run preview -- --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sSo /dev/null -w 'app serves: %{http_code}\n' http://127.0.0.1:4173/

      - name: The app's checks
        working-directory: app
        env:
          APP_URL: http://127.0.0.1:4173
        run: node checks/run.mjs

      - name: Keep the app's screenshots when the checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-shots
          path: app/shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Screenshots, for a human to look at
        # A camera, not a check: it asserts nothing and must never fail the run.
        # CLAUDE.md section 3 -- looking is available, so make it available here too.
        # It runs from the repo root, where playwright is installed, and writes nine
        # screenshots of the app's screens into dist/shots/.
        if: always()
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:4173
        run: node tools/look.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: dist/shots/
          if-no-files-found: ignore
          retention-days: 14

  poisons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, so one blind poison does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and a browser
        # Same place and same version as the `app` job; see the note there.
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run build

      - name: Serve the built app
        working-directory: app
        run: |
          npm run preview -- --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sSo /dev/null -w 'app serves: %{http_code}\n' http://127.0.0.1:4173/

      - name: Every poison in this shard must be seen by its own check
        # Each poison damages the real page at one stop and the check named for it
        # must be seen to fail. A check nobody has watched fail is not a check.
        # Poison i runs in shard (i mod 3) + 1, so the three shards cover every
        # poison exactly once.
        working-directory: app
        env:
          APP_URL: http://127.0.0.1:4173
        run: node checks/run.mjs --all-poisons --shard ${{ matrix.shard }}/3
