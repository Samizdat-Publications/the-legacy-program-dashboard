# The gate, run somewhere that is not one person's container.
#
# TWO JOBS, SINCE 3 SEPTEMBER 2026.
#
#   gate  the old shell's gate: the pipeline, the reproducibility check, and every
#         browser check against dist/the-program.html. That shell is no longer
#         deployed anywhere, but it still builds and it still carries the bulk of
#         the evidence over the research data, so it stays checked until it is
#         retired in its own session.
#   app   the new shell's gate: build app/, serve the build, run its own C1 to C17
#         checks and all seventeen poisons against the real pages, then point
#         tools/look.js at the same server and keep the screenshots.
#
# deploy.yml keys off this WORKFLOW's conclusion, not off one job, so `app` gates
# the production deploy without deploy.yml knowing it exists.
#
# WHY. Until 28 August 2026 the gate could only ever run in the Claude Code cloud
# container, because four of its steps hardcoded that container's Chromium path.
# So "the gate is green" was a sentence exactly one actor could say, and nothing
# checked a push made by anyone else. tools/browser_env.js fixed the portability;
# this file is what portability was FOR.
#
# COST. This repository is private, so these minutes are billed against the account's
# Actions allowance. MEASURED on the first run (28 August 2026): 7m16s wall for the
# whole job, of which the gate step was 5m04s and the browser install 26s. That is
# faster than the same gate in the dev container. If it is not wanted, delete this
# file -- the gate still runs locally and nothing else depends on it.
#
# WHAT IT DOES NOT DO. It does not deploy. .github/workflows/deploy.yml does that,
# on master, after this workflow finishes green.

name: gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # The board's own history carries a 15MB dist/ and 13MB of data/ per commit,
          # so a full clone is large and none of it is needed to run the gate.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No pip step. Every tool the gate runs is Python standard library plus this
      # repo's own modules. pypdf appears in tools/spot_check.py, which is a network
      # tool deliberately kept OUT of the gate -- CLAUDE.md section 9 item 9 explains
      # why: a check that fails because a host is throttling is a check people learn
      # to ignore. If you add a dependency, add it here and say what needs it.

      - name: Install Playwright and a browser
        # Pinned to the version the tools were written against. browser_env.js finds
        # whatever this installs -- no path is baked into the source any more.
        run: |
          npm install --no-save playwright@1.56.1 http-server@14
          npx playwright install --with-deps chromium

      - name: Resolve the browser, and prove the resolver
        # First, because if this fails the browser gate steps cannot start and every
        # later failure would be noise. It is also the one gate step that needs no
        # browser and no server, so it is the cheapest place to learn the truth.
        run: |
          node -e "console.log(require('./tools/browser_env').describe())"
          node tools/test_browser_env.js --self-test

      - name: Build
        # Order matters and is not negotiable: later stages consume earlier output.
        # CLAUDE.md section 3 is the authority.
        #
        # tools/build_app_data.py is deliberately NOT in this list. It writes
        # app/public/data/, which is what the shipped app reads, and that output is
        # checked in the `app` job below against the same committed inputs with a
        # plain git diff. Its fingerprint has been content-only since 4 September
        # 2026 (CRLF-normalised bytes, no git id), so it could join this list; it
        # stays in the app job so the app's data and the app's checks fail together.
        #
        run: |
          python3 tools/merge.py
          python3 tools/regrade.py
          python3 tools/merge.py
          python3 tools/build_l0.py
          python3 tools/build_design_extract.py
          node    tools/build_l0_layout.mjs
          python3 tools/build_dashboard.py

      - name: The build must be reproducible from what is committed
        # A rebuild from committed source must reproduce the committed artifacts. If
        # this fails, someone edited research/ and pushed without rebuilding, or
        # edited a build product by hand -- and the board a reader sees is not the
        # board the sources describe. Nothing else catches that. e04b705 did exactly
        # that and left `master` red.
        #
        # This was `git diff --quiet` until 30 August 2026, and it had a false
        # failure that fired at 00:01 UTC that morning: every artifact carries a
        # build-DATE stamp, so a rebuild on a different UTC day from the machine that
        # built the commit differs in eleven files by one line each, with nothing
        # actually wrong. verify.py --idempotent already neutralised that stamp and
        # said so in its own comment; the knowledge had never been carried across.
        #
        # The obvious fix -- `git diff -I<regex>` -- would have been WORSE THAN THE
        # BUG. data/l0-model.json, data/l0-layout-model.json and
        # data/design-extract.json are each a single line, so the one changed line
        # always contains the stamp and every real change to them would have been
        # ignored. tools/check_rebuild.py normalises the stamp on both sides and
        # compares full bytes instead. It is self-tested.
        run: python3 tools/check_rebuild.py

      - name: Keep the rebuilt artifacts when they differ
        # A local session cannot see what Linux built. On 3 September 2026 a
        # Windows-built commit failed the step above by a few bytes in three files
        # and the only way to find them was to guess. Upload the rebuild so the
        # next session can download it and diff.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-artifacts
          retention-days: 7
          path: |
            data/l0-model.json
            data/design-extract.json
            data/l0-layout-model.json
            dist/the-program.html

      - name: ...and that check must be able to fail
        run: python3 tools/check_rebuild.py --self-test

      - name: Serve the board
        # file:// does not work for a 15MB page: it never finishes parsing.
        run: |
          npx http-server dist -p 8899 --silent &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:8899/the-program.html && break
            sleep 1
          done
          curl -sSo /dev/null -w 'board serves: %{http_code}\n' \
            http://127.0.0.1:8899/the-program.html

      - name: Gate
        # state_snapshot --gate runs every check and reports them together. It exits
        # non-zero when any step fails, and names a skip rather than reporting a
        # browser problem as a board problem.
        env:
          BOARD_URL: http://127.0.0.1:8899/the-program.html
        run: python3 tools/state_snapshot.py --gate

      # The camera moved to the `app` job on 3 September 2026, with look.js itself:
      # it reads APP_URL now and photographs the app's nine screens. There is no
      # camera pointed at the old shell any more.

  # The new shell's own gate. Independent of `gate` above: it builds app/ from what
  # is committed and drives the built pages in a real browser. Both jobs must be
  # green for deploy.yml to fire, because it waits on the workflow's conclusion.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The app's data must match what it is derived from
        # First, because it is seconds and because everything after it is checking a
        # board built from these files. The 1,067 committed files under
        # app/public/data/ are generated, and until 3 September 2026 nothing in CI
        # ran the generator -- so they could drift from data/ and research/ with the
        # gate staying green, and after the cutover that drift is what a reader sees.
        #
        # A PLAIN `git diff --quiet`, no -I flags, since 4 September 2026. It carried
        # -I'"sourceCommit"' -I'"generated"' for one day, and that was a patch over a
        # generator defect rather than a fix of it. Both are gone, and so is the
        # defect. index.json no longer publishes "sourceCommit": it named whatever
        # commit .git/HEAD pointed at, which is a property of the checkout and not of
        # the data. And `source` is now a hash of the input bytes with newlines
        # normalised to LF, so it too stops being a function of the checkout -- this
        # repo has no .gitattributes, a Windows clone with core.autocrlf=true gets
        # CRLF in every text input, and the same commit hashed 3c5aa769b9d2 on the
        # machine that committed the data and e5835f8cdaf3 here. That is what turned
        # this step red on every push: seven files by one line each, index.json by
        # two. `generated` was never the problem -- it is the newest `generated`
        # string among the inputs, so it already matched on both machines.
        #
        # Every value written under app/public/data/ is now a function of the inputs'
        # content and of nothing else, which is what lets this compare full bytes.
        # The repo's standing warning against `git diff -I` -- data/l0-model.json and
        # its two one-line siblings, where the one changed line always carries the
        # stamp and every real change would be swallowed -- needs no exception here
        # any more.
        run: |
          python3 tools/build_app_data.py
          git diff --quiet -- app/public/data/ || {
            echo "::error::app/public/data/ is not what tools/build_app_data.py produces from the committed sources."
            git --no-pager diff --stat -- app/public/data/
            exit 1
          }

      - name: ...and that check must be able to fail
        # Shown, not asserted. --self-test runs --check against the real board and
        # then against a copy with one node removed, and fails if the poisoned copy
        # is accepted.
        run: python3 tools/build_app_data.py --self-test

      - name: Install Playwright and a browser
        # At the REPO ROOT, deliberately, and pinned to the same version the `gate`
        # job uses. app/checks/run.mjs imports 'playwright' bare and app/node_modules
        # carries none, so Node resolves upward to the root install. Keep the two
        # jobs on one version: a check that passes on one browser build and fails on
        # another teaches nobody anything.
        run: |
          npm install --no-save playwright@1.56.1 http-server@14
          npx playwright install --with-deps chromium

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run build

      - name: Serve the built app
        # The checks drive the BUILD, not the dev server, so what they walk is what
        # Pages would serve. --host 127.0.0.1 is not decoration: plain `vite preview`
        # binds IPv6 only here, and the checks fetch 127.0.0.1.
        working-directory: app
        run: |
          npm run preview -- --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sSo /dev/null -w 'app serves: %{http_code}\n' http://127.0.0.1:4173/

      - name: The app's checks
        working-directory: app
        env:
          APP_URL: http://127.0.0.1:4173
        run: node checks/run.mjs

      - name: ...and every one of them must be able to fail
        # Each poison damages the real page at one stop and the check named for it
        # must be seen to fail. A check nobody has watched fail is not a check.
        working-directory: app
        env:
          APP_URL: http://127.0.0.1:4173
        run: node checks/run.mjs --all-poisons

      - name: Keep the app's screenshots when the checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-shots
          path: app/shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Screenshots, for a human to look at
        # A camera, not a check: it asserts nothing and must never fail the run.
        # CLAUDE.md section 3 -- looking is available, so make it available here too.
        # It runs from the repo root, where playwright is installed, and writes nine
        # screenshots of the app's screens into dist/shots/.
        if: always()
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:4173
        run: node tools/look.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: dist/shots/
          if-no-files-found: ignore
          retention-days: 14
