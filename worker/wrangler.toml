name = "the-program-analyst"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# The key is NEVER in this file and never in the repo. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# which prompts for the value and sends it straight to Cloudflare.

# Per-IP rate limit on the analyst, in code rather than as a dashboard rule
# nothing in the repo could prove existed. 20 calls per minute per IP. The
# period must be 10 or 60; namespace_id is any integer unique in the account.
[[ratelimits]]
name = "ANALYST_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# And a ceiling across every caller together, so many addresses cannot add up
# to an open account. 60 a minute is more than the board's readers will ever
# use at once and a hard cap on what anyone else can spend.
[[ratelimits]]
name = "ANALYST_GLOBAL_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

[observability]
enabled = true
